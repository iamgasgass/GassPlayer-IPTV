name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE="/Applications/Xcode.app"
          fi
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate GassPlayer.xcodeproj
        run: xcodegen generate

      - name: Detect available iOS Simulator
        id: sim
        run: |
          DEVICE_LINE=$(xcrun simctl list devices available | grep -E "iPhone" | grep -v "unavailable" | head -n 1)
          if [ -z "$DEVICE_LINE" ]; then
            echo "ERRORE: nessun simulatore iPhone disponibile su questo runner"
            exit 1
          fi
          DEVICE_UDID=$(echo "$DEVICE_LINE" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}')
          echo "udid=$DEVICE_UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test -project GassPlayer.xcodeproj -scheme GassPlayer -destination "id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO

      - name: Check signing secrets availability
        id: signing_check
        env:
          HAS_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$HAS_CERT" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import certificate and provisioning profile
        if: steps.signing_check.outputs.has_signing == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp $PP_PATH "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build archive
        run: |
          set -o pipefail
          mkdir -p build
          if [ "${{ steps.signing_check.outputs.has_signing }}" = "true" ]; then
            xcodebuild archive -project GassPlayer.xcodeproj -scheme GassPlayer -archivePath build/GassPlayer.xcarchive -destination 'generic/platform=iOS' -sdk iphoneos CODE_SIGN_STYLE=Manual
          else
            xcodebuild archive -project GassPlayer.xcodeproj -scheme GassPlayer -archivePath build/GassPlayer.xcarchive -destination 'generic/platform=iOS' -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="" SKIP_INSTALL=NO
          fi

      - name: Package IPA
        run: |
          APP_PATH="build/GassPlayer.xcarchive/Products/Applications/GassPlayer.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERRORE: $APP_PATH non trovato"
            exit 1
          fi
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r GassPlayer.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GassPlayer-ipa
          path: build/GassPlayer.ipa
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
