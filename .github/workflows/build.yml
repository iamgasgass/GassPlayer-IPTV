name: Build IPA (unsigned + firma opzionale)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          [ -z "$LATEST_XCODE" ] && LATEST_XCODE="/Applications/Xcode.app"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate GassPlayer.xcodeproj
        run: xcodegen generate

      - name: Import certificate and provisioning profile (se presenti)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed archive (se certificato presente)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project GassPlayer.xcodeproj -scheme GassPlayer \
            -archivePath build/GassPlayer.xcarchive \
            -destination 'generic/platform=iOS' -sdk iphoneos \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee build/xcodebuild.log

      - name: Build unsigned archive (fallback senza certificato)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 == '' }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project GassPlayer.xcodeproj -scheme GassPlayer \
            -archivePath build/GassPlayer.xcarchive \
            -destination 'generic/platform=iOS' -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="" SKIP_INSTALL=NO \
            2>&1 | tee build/xcodebuild.log

      - name: Upload build log (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: warn

      - name: Verify .app was produced
        run: |
          APP_PATH="build/GassPlayer.xcarchive/Products/Applications/GassPlayer.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERRORE: $APP_PATH non trovato. Apri l'artifact 'xcodebuild-log' per la causa esatta."
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/GassPlayer.xcarchive/Products/Applications/GassPlayer.app" build/Payload/
          cd build && zip -r GassPlayer.ipa Payload && cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GassPlayer-ipa
          path: build/GassPlayer.ipa
          if-no-files-found: error

      - name: Notifica Telegram (se configurato)
        if: ${{ always() && secrets.TELEGRAM_BOT_TOKEN != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" -d text="GassPlayer build: ${{ job.status }} (commit ${{ github.sha }})"

      - name: Notifica Slack (se configurato)
        if: ${{ always() && secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"GassPlayer build: ${{ job.status }} (commit ${{ github.sha }})\"}" "$SLACK_WEBHOOK_URL"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
