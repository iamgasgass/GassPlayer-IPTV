name: GassPlayer
options:
  bundleIdPrefix: com.iamgasgass
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO

packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    branch: main
  WireGuardKit:
    # Fork di terze parti (non il repo ufficiale WireGuard/wireguard-apple)
    # che distribuisce il backend Go precompilato come XCFramework binario
    # via SPM puro. Scelto perche' il repo ufficiale richiede un target
    # "External Build System" con script di build manuale in Xcode, non
    # esprimibile in XcodeGen/project.yml e quindi incompatibile con una
    # build headless via `xcodegen generate` + `xcodebuild` come questa.
    # Essendo un fork non mantenuto dal team WireGuard, e' una libreria
    # crittografica di cui non posso garantire l'audit: usata su richiesta
    # esplicita, valutane l'affidabilita' prima di andare in produzione.
    url: https://github.com/ridgelineinternational/wireguard-apple-xcframework.git
    from: "0.0.1"

targets:
  GassPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GassPlayer
        excludes:
          - "Resources/Info.plist"
          - "Resources/GassPlayer.entitlements"
          - "Resources/GassPlayer-CI.entitlements"
          - "PacketTunnel/**"
    resources:
      - path: GassPlayer/Resources/Assets.xcassets
    entitlements:
      path: GassPlayer/Resources/GassPlayer-CI.entitlements
    dependencies:
      - target: PacketTunnel
        embed: true
      - package: KSPlayer
        product: KSPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GassPlayer/Resources/Info.plist
        PRODUCT_NAME: GassPlayer
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.gassPlayer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - GassPlayerTests
      gatherCoverageData: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GassPlayer/PacketTunnel
        excludes:
          - "Info.plist"
          - "PacketTunnel.entitlements"
    entitlements:
      path: GassPlayer/PacketTunnel/PacketTunnel.entitlements
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GassPlayer/PacketTunnel/Info.plist
        PRODUCT_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.gassPlayer.PacketTunnel
        SKIP_INSTALL: NO

  GassPlayerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GassPlayerTests
    dependencies:
      - target: GassPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.gassPlayer.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GassPlayer.app/GassPlayer"
        BUNDLE_LOADER: "$(TEST_HOST)"
