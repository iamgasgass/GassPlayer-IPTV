name: GassPlayer
options:
  bundleIdPrefix: com.iamgasgass
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  GassPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GassPlayer
        excludes:
          - "Resources/Info.plist"
          - "Resources/GassPlayer.entitlements"
    resources:
      - path: GassPlayer/Resources/Assets.xcassets
    info:
      path: GassPlayer/Resources/Info.plist
    entitlements:
      path: GassPlayer/Resources/GassPlayer.entitlements
    settings:
      base:
        PRODUCT_NAME: GassPlayer
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.gassPlayer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
      gatherCoverageData: false
      commandLineArguments: {}
