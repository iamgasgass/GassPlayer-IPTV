name: GassPlayer
options:
  bundleIdPrefix: com.iamgasgass
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  GassPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GassPlayer
        excludes:
          - "Resources/Info.plist"
          - "Resources/GassPlayer.entitlements"
          - "Resources/GassPlayer-CI.entitlements"
          - "PacketTunnel/**"
    resources:
      - path: GassPlayer/Resources/Assets.xcassets
    info:
      path: GassPlayer/Resources/Info.plist
    entitlements:
      path: GassPlayer/Resources/GassPlayer-CI.entitlements
    dependencies:
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_NAME: GassPlayer
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.gassPlayer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - GassPlayerTests
      gatherCoverageData: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GassPlayer/PacketTunnel
        excludes:
          - "Info.plist"
          - "PacketTunnel.entitlements"
    info:
      path: GassPlayer/PacketTunnel/Info.plist
    entitlements:
      path: GassPlayer/PacketTunnel/PacketTunnel.entitlements
    settings:
      base:
        PRODUCT_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.gassPlayer.PacketTunnel
        SKIP_INSTALL: NO

  GassPlayerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GassPlayerTests
    dependencies:
      - target: GassPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.gassPlayer.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GassPlayer.app/GassPlayer"
        BUNDLE_LOADER: "$(TEST_HOST)"
